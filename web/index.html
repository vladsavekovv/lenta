  <script>
    // Older TV web engines (e.g. Samsung TVs before 2023) get the same app rewritten for them (web/legacy/).
    window.LENTA_LEGACY = !(window.CSS && CSS.supports && CSS.supports('aspect-ratio', '1'));
    try { new Function('var a = {}; return a?.b ?? 1'); } catch (e) { window.LENTA_LEGACY = true; }
    if (/[?&]legacy=1/.test(location.search)) window.LENTA_LEGACY = true;          // to try it on a normal browser
    document.write(window.LENTA_LEGACY ? '<link rel="stylesheet" href="legacy/app.css">'
      : '<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/mobile.css"><link rel="stylesheet" href="css/theme-redline.css">');
