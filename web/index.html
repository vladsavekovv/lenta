<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17121F">
  <title>LENTA</title>
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LENTA">
  <meta name="format-detection" content="telephone=no">
  <!-- trailers play from YouTube: connect early so they start sooner -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.google.com">
  <link rel="dns-prefetch" href="https://googlevideo.com">
  <link rel="stylesheet" href="css/fonts.css">
  <script>
    // Three builds of the same app, because a television is not one browser. A Samsung set runs
    // Chromium 47 in 2017, 56 in 2018, then 63, 69, 76 and 85 up to 2022, and 94 from 2023.
    //
    //   new   2023 and later   web/js + web/css, as written
    //   mid   2019 to 2022     web/legacy/mid.*   grid, variables and modern JavaScript all work;
    //                          only aspect-ratio, flex gap and clamp() came later
    //   old   2017 and 2018    web/legacy/app.*   no grid, no custom properties, no modern syntax
    //
    // Always by asking the engine what it can do, never by its user agent — a test enforces that. Each
    // test names the oldest engine that passes it: CSS grid is Chromium 57 and object spread is 60, so
    // a 2018 set (56) fails both and correctly falls through to the oldest build.
    (function () {
      var q = location.search;
      var can = function (p, v) { return !!(window.CSS && CSS.supports && CSS.supports(p, v)); };
      var parses = function (src) { try { new Function(src); return true; } catch (e) { return false; } };
      var tier = can('aspect-ratio', '1') && parses('var a = {}; return a?.b ?? 1') ? 'new'
        : can('display', 'grid') && parses('return (async function () { return { ...{} }; })') ? 'mid'
        : 'old';
      if (/[?&]legacy=1/.test(q)) tier = 'old';                   // to try either on a normal browser
      if (/[?&]legacy=2/.test(q)) tier = 'mid';
      window.LENTA_TIER = tier;
      window.LENTA_LEGACY = tier !== 'new';              // true for either of the built clients
      document.write(tier === 'old' ? '<link rel="stylesheet" href="legacy/app.css">'
        : tier === 'mid' ? '<link rel="stylesheet" href="legacy/mid.css">'
        : '<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/mobile.css"><link rel="stylesheet" href="css/theme-netflix.css"><link rel="stylesheet" href="css/theme-hbo.css"><link rel="stylesheet" href="css/tv.css">');
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <nav id="rail" class="rail" aria-label="Main"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="musicbar" class="musicbar" hidden></div>
  <div id="player-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script>
    // hls.js is half a megabyte, and a television has to read, compile and keep all of it before the app
    // can start — on a Samsung set that is most of a second of a blocked screen. A TV plays HLS itself,
    // so it does not need the library at all unless that turns out to be untrue, and the player asks for
    // it then (see ensureHls in js/player.js). Every other browser loads it here, as before, so nothing
    // waits for it at the moment somebody presses play.
    (function () {
      var p = location.search, tv = /[?&]tvapp=1/.test(p) || /[?&]tv=1/.test(p);
      try { tv = tv || sessionStorage.getItem('lenta-tvapp') === '1' || sessionStorage.getItem('lenta-tv') === '1'; } catch (e) { /* no storage */ }
      if (!/[?&]tv=0/.test(p) && !tv) tv = /Tizen|SMART-TV|SmartTV|Web0S|webOS|NetCast|BRAVIA|AFTS|AFTM|GoogleTV|CrKey|HbbTV/i.test(navigator.userAgent);
      window.LENTA_HLS_SRC = 'vendor/hls.min.js';
      if (!tv) document.write('<script src="vendor/hls.min.js"><\/script>');
    })();
  </script>
  <script>document.write(window.LENTA_TIER === 'old' ? '<script src="legacy/app.js"><\/script>'
    : window.LENTA_TIER === 'mid' ? '<script src="legacy/mid.js"><\/script>'
    : '<script type="module" src="js/app.js"><\/script>');</script>
</body>
</html>
